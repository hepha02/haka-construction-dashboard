<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HAKA 로그인 복구</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f4f7f8;
        color: #162033;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(430px, 100%);
        display: grid;
        gap: 14px;
        padding: 28px;
        border: 1px solid #dfe6ee;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 18px 50px rgba(20, 32, 48, .14);
      }
      h1 { margin: 0; font-size: 28px; line-height: 1.2; letter-spacing: 0; }
      p { margin: 0; color: #526174; font-size: 15px; line-height: 1.55; font-weight: 700; word-break: keep-all; }
      button, a {
        width: 100%;
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 900;
        text-decoration: none;
      }
      button { border: 0; background: #237c63; color: #fff; cursor: pointer; }
      a { border: 1px solid #d6e0e8; color: #162033; background: #fff; }
      .done { color: #237c63; font-weight: 900; }
    </style>
  </head>
  <body>
    <main>
      <h1>로그인 복구</h1>
      <p>이 화면은 브라우저에 남아있는 이전 로그인 정보만 초기화합니다. 공사비 데이터, 결제 신청, 첨부파일은 삭제하지 않습니다.</p>
      <button type="button" id="reset-login">로그인 상태 초기화하고 다시 열기</button>
      <a href="/haka-construction-dashboard/?v=manual-open">초기화 없이 다시 열기</a>
      <p id="message"></p>
    </main>
    <script>
      function clearLogin() {
        const keys = [];
        for (let i = 0; i < localStorage.length; i += 1) {
          const key = localStorage.key(i);
          if (!key) continue;
          if (key.includes("haka_transfer_export_ledger_v1")) continue;
          if (key.includes("supabase") || key.includes("sb-yqemtsbdnypgmkuyncxh")) keys.push(key);
        }
        keys.forEach((key) => localStorage.removeItem(key));
        sessionStorage.clear();
      }
      document.getElementById("reset-login").addEventListener("click", () => {
        clearLogin();
        document.getElementById("message").className = "done";
        document.getElementById("message").textContent = "초기화 완료. 로그인 화면으로 이동합니다.";
        setTimeout(() => {
          location.href = "/haka-construction-dashboard/?v=login-reset-" + Date.now();
        }, 700);
      });
    </script>
  </body>
</html>
